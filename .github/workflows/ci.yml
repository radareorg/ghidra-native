---
name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  dist-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
        id: version
      - name: Distribution Zip
        run: make dist
      - name: Pub
        uses: actions/upload-artifact@v7
        with:
          name: ghidra-native-${{ steps.version.outputs.version }}.zip
          path: ghidra-native-${{ steps.version.outputs.version }}.zip
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12.x
      - name: Dependencies
        run: python -m pip install meson ninja
      - name: Configure
        run: meson setup build -Dtests=true
      - name: Build
        run: meson compile -C build
      - name: Unit tests
        run: meson test -C build --print-errorlogs
      - name: Reuse patched sources
        run: python scripts/apply_patches.py
